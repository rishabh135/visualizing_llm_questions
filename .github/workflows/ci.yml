name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No lockfile is committed (the local one points at a private mirror); direct deps are pinned exactly.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - run: python3 -m unittest discover -s public/labs -p 'test_*.py'
